# CONTRIBUTING.md asks for every commit signed off (`git commit -s`),
# the Developer Certificate of Origin. For a GPL project that ports
# code it is the only record of where a contribution came from, so a
# pull request is checked for it here: each commit, merges and bots
# aside, carries a `Signed-off-by` line naming its author's email.
name: Sign-off

on:
  pull_request:

permissions:
  contents: read

jobs:
  sign-off:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Every commit is signed off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            email=$(git show -s --format=%ae "$sha")
            case "$email" in
              *'[bot]@users.noreply.github.com') continue ;;
            esac
            if ! git show -s --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" \
                | grep -qiF "<$email>"; then
              echo "::error::$(git show -s --format='%h %s' "$sha") has no Signed-off-by line from its author"
              missing=1
            fi
          done
          if [ "$missing" = 1 ]; then
            echo "Sign off with: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
