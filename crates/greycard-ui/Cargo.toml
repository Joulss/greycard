[package]
name = "greycard-ui"
version.workspace = true
description = "The editor: a Slint front end over greycard-core with a wgpu viewport"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

# The modules with no window in them; the binary names them as its own.
[lib]
path = "src/lib.rs"

[[bin]]
name = "greycard-ui"
path = "src/main.rs"

[dependencies]
greycard-core = { path = "../greycard-core" }
greycard-edit = { path = "../greycard-edit" }
greycard-edit-io = { path = "../greycard-edit-io" }
greycard-ai = { path = "../greycard-ai" }
greycard-lens = { path = "../greycard-lens" }
greycard-gpu = { path = "../greycard-gpu" }
# The thumbnail cache, keyed by the index's content hash.
greycard-library = { path = "../greycard-library" }
# The camera match: the fit the Look section runs over a group.
greycard-match = { path = "../greycard-match" }
# The window, its panels and its sheets, compiled from `.slint` in a
# crate of their own so a change here does not compile them again.
greycard-slint = { path = "../greycard-slint" }
# What makes a developed frame into a picture or a file: the finish,
# AgX, the detail bands, the geometry, the border, the watermark and
# the export.
greycard-render = { path = "../greycard-render" }
# The develop below the window: the stage list, the walk, the worker,
# and what it holds.
greycard-engine = { path = "../greycard-engine" }
# winit's window behind Slint's, for the monitor the window opens on.
slint.workspace = true
bytemuck.workspace = true
# greycard-render's half and lcms2, feature for feature.
half = { workspace = true, features = ["bytemuck"] }
lcms2.workspace = true
rayon.workspace = true
image.workspace = true
clap.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
dirs.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true
# Report a problem opens the issue form in the browser. Slint's winit
# backend already carries this on every platform, so it adds nothing
# to the tree.
webbrowser = "1.2"
# The update check's one request to GitHub's releases API. The model
# and lens downloads already bring it.
ureq.workspace = true
# The import's verify, a hash of the whole file. The library's index
# already brings it.
blake3.workspace = true
# Paths compared as the file system has them, without the prefix
# Windows puts on a canonical path. The library already brings it.
dunce.workspace = true
# A file's modification day in local time, for a name when the EXIF
# has no date. rawler already brings it, clock and all.
chrono = { version = "0.4", default-features = false, features = ["clock"] }
# Delete from disk: the system trash (the freedesktop trash on Linux,
# the Finder's on macOS, the Recycle Bin on Windows). MIT. The default
# features are the ones it needs: chrono for the deletion date the
# freedesktop spec asks for, already in the tree, and the COM apartment
# on Windows, over the windows crate the tree already has.
trash = "5.2"

[features]
# Nikon High Efficiency raws; off by default, see greycard-core.
nikon-he = ["greycard-core/nikon-he"]

# The icon and the version fields Explorer, the taskbar and the file
# properties sheet read out of the executable itself. Windows only:
# every other desktop takes its icon from the .desktop entry or the
# bundle beside the binary.
[target."cfg(windows)".build-dependencies]
winresource.workspace = true

[dev-dependencies]
# The shader compiler wgpu already carries, named here so `cargo test`
# can parse and validate the WGSL without a GPU. Same version wgpu 30
# resolves, so this adds nothing to the tree.
naga.workspace = true
# A headless backend so the window's key handling can be tested.
i-slint-backend-testing = "1.18"
# For a device of our own in the worker's GPU fallback tests.
pollster.workspace = true
# The render crate's test helpers, which these tests share (a camera
# profile, a scratch folder's removal, a watermark picture), and the
# CPU references the viewport's tests hold the GPU to.
greycard-render = { path = "../greycard-render", features = ["testing"] }
# The engine's test helpers and hooks: a worker for a test, the camera
# picture's reads, the edit's pictures' rig.
greycard-engine = { path = "../greycard-engine", features = ["testing"] }
# Frames with real EXIF, for the library index's tests.
greycard-library = { path = "../greycard-library", features = ["fixtures"] }
# The count of synced writes, for the tests that a file goes through
# the shared write.
greycard-edit = { path = "../greycard-edit", features = ["testing"] }
# A second connection that holds the library's write lock, for the
# test of a locked index. The library's own, so nothing new in the tree.
rusqlite.workspace = true

# The file chooser portal and colord are the desktop's on Linux.
# zbus needs an async runtime named even where only its blocking API
# is used; Slint's tray support happens to pull the same crate with
# `async-io` on, and this does not lean on that.
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["blocking-api", "async-io"] }

# Everywhere else the dialogs are the platform's own. Without the
# default features rfd leaves out the GTK and portal backends, which
# are Linux's and are not wanted here.
[target.'cfg(not(target_os = "linux"))'.dependencies]
rfd = { version = "0.17", default-features = false }

# The import's rename that never replaces (renameat2, renamex_np), its
# read-back from the drive rather than the cache (posix_fadvise,
# F_NOCACHE), and its sweep's check that a process is gone (kill with
# signal 0), and the user id a second launch finds the running
# editor's socket by (getuid). Already in the tree.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# The window manager's work area on X11 (_NET_WORKAREA), read over a
# connection of our own. winit and softbuffer already carry it.
[target.'cfg(all(unix, not(any(target_os = "macos", target_os = "ios", target_os = "android"))))'.dependencies]
x11rb = { version = "0.13", default-features = false }

# The same rename on Windows: MoveFileExW without REPLACE_EXISTING. The
# version and feature greycard-edit already asks for. And the startup
# info (GetStartupInfoW), for a shortcut set to open the window
# maximized: a module of the same crate, nothing new in the tree. The
# precision touchpad's scrolling direction (RegGetValueW) and a wheel
# message's source (GetCurrentInputMessageSource) are two more, and a
# monitor's work area (GetMonitorInfoW). The named pipe a second
# launch hands its path over (CreateNamedPipeW, overlapped I/O), the
# user's SID it is named by and kept to (the process token, an SDDL
# DACL), the session (ProcessIdToSessionId), and the foreground given
# to the running editor (AllowSetForegroundWindow) are more.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Graphics_Gdi", "Win32_Security", "Win32_Security_Authorization", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Pipes", "Win32_System_Registry", "Win32_System_RemoteDesktop", "Win32_System_Threading", "Win32_UI_Input", "Win32_UI_WindowsAndMessaging"] }

# The Finder's open: a method added to winit's application delegate,
# and the URLs it is handed. winit carries both already on the Mac.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSDictionary", "NSEnumerator", "NSString", "NSURL", "NSValue"] }
# The displays' profiles from ColorSync (CoreGraphics), and their names
# and work areas (NSScreen). winit already carries all three on the Mac.
objc2-core-foundation = { version = "0.3", default-features = false, features = ["std", "CFData", "CFPreferences", "CFString"] }
objc2-core-graphics = { version = "0.3", default-features = false, features = ["std", "CGColorSpace", "CGDirectDisplay", "CGDisplayConfiguration", "CGError"] }
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSGraphics", "NSScreen"] }
