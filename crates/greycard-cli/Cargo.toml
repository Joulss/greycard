[package]
name = "greycard-cli"
version.workspace = true
description = "Command-line RAW pre-processor built on greycard-core"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[[bin]]
name = "greycard"
path = "src/main.rs"

[dependencies]
greycard-core = { path = "../greycard-core" }
greycard-ai = { path = "../greycard-ai" }
greycard-lens = { path = "../greycard-lens" }
greycard-edit = { path = "../greycard-edit" }
greycard-edit-io = { path = "../greycard-edit-io" }
greycard-library = { path = "../greycard-library" }
# The editor's export with no window, and the settings it reads.
greycard-engine = { path = "../greycard-engine" }
# The export's own device, which the engine is lent and never makes.
greycard-gpu = { path = "../greycard-gpu" }
image.workspace = true
clap.workspace = true
anyhow.workspace = true
log.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tracing-log.workspace = true

[dev-dependencies]
# The scratch folder's removal the tests share.
greycard-core = { path = "../greycard-core", features = ["testing"] }
# Frames with real EXIF for the listing's tests.
greycard-library = { path = "../greycard-library", features = ["fixtures"] }

[features]
# Nikon High Efficiency raws; off by default, see greycard-core.
nikon-he = ["greycard-core/nikon-he"]

# The icon and the version fields Explorer and the file properties
# sheet read out of the executable itself. Windows only: every other
# desktop takes its icon from the .desktop entry or the bundle beside
# the binary.
[target."cfg(windows)".build-dependencies]
winresource.workspace = true
