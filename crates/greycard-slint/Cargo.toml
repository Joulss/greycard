[package]
name = "greycard-slint"
version.workspace = true
description = "The editor's Slint UI compiled to Rust: the window, its panels and its sheets, which greycard-ui drives"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

# No tests of its own: the editor's tests drive this UI. A test build of
# the library would compile all the generated code a second time, for
# nothing, in every `cargo test` of the workspace.
[lib]
test = false
doctest = false

[dependencies]
# The workspace's Slint, the editor's whole feature list and
# not only what the generated code needs, so Slint resolves the same
# whichever of the two crates is named. The rest of the tree does not:
# on its own this crate leaves out features the editor's other
# dependencies turn on (image, zbus, chrono, and a dozen more), so
# `cargo build -p greycard-slint` compiles a second copy of the Slint
# stack and of this crate, which the editor's build does not use. Build
# it through greycard-ui; a build of the editor, its tests, or the
# workspace all resolve the same one.
slint.workspace = true

[build-dependencies]
slint-build = "1.18"
