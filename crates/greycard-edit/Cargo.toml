[package]
name = "greycard-edit"
version.workspace = true
description = "The edit: a typed, versioned description of a development in physical units, and its sidecar"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[dependencies]
log.workspace = true
greycard-core = { path = "../greycard-core" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
dirs.workspace = true
# State ids and revisions in the sidecar (§233); the hash the library
# and the editor already use for a file's identity.
blake3.workspace = true
# The host's name on a revision. Already in the tree through x11rb.
gethostname = "1"
[features]
# A count of the synced writes, for the tests of the crates that write
# through them.
testing = []

[target.'cfg(unix)'.dependencies]
# The errors a sync gives on a volume that cannot sync. Already in the
# tree through greycard-ai and greycard-ui.
libc.workspace = true

[target.'cfg(windows)'.dependencies]
# For the hidden attribute on the sidecar folder; a leading dot hides
# nothing on Windows.
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
# The scratch folder's removal the tests share.
greycard-core = { path = "../greycard-core", features = ["testing"] }
# A camera profile made by hand, for the local white balance's tests.
# Already in the tree through greycard-core.
rawcolor.workspace = true
