[package]
name = "greycard-ai"
version.workspace = true
description = "Learned models for greycard: the runtime, the model store, and the masks"
license = "GPL-3.0-or-later"
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
repository.workspace = true

[lints]
workspace = true

[features]
default = ["webgpu", "coreml"]
# Which execution providers the build tries; the library that carries
# them is made by scripts/ort-dylib.sh (WebGPU's) or named by
# GREYCARD_ORT_DYLIB. WebGPU runs on any Vulkan, Metal or DX12 device
# through Dawn; CUDA wants CUDA 13 and cuDNN on the system at run
# time, and a library built with it. Each also pulls in a way to name
# the adapter it ran on, for the provider-outcome record (runtime.rs,
# notes §97): `wgpu` for WebGPU (the same struct `greycard-ui` reads
# off its own device), `nvidia-smi` at run time for CUDA, since
# neither `ort` nor ONNX Runtime exposes the adapter it picked. On an
# Intel Mac the provider is not offered even with the feature on
# (build.rs): the library there is our own build, without WebGPU.
webgpu = ["ort/webgpu", "dep:wgpu", "dep:pollster", "dep:ash"]
# Core ML on macOS, tried before WebGPU and timed against it (on an
# Intel Mac, before the CPU, there being no WebGPU). On by
# default everywhere since a feature cannot default per target: it
# only adds `ort`'s registration code (with `load-dynamic`, ort-sys
# links and downloads nothing for it), and the provider is offered
# only where `target_os = "macos"`, whose library carries it.
coreml = ["ort/coreml"]
cuda = ["ort/cuda"]

[dependencies]
log.workspace = true
greycard-core = { path = "../greycard-core" }
rayon.workspace = true
# Loaded at first use (`load-dynamic`), never linked: pyke's prebuilt
# ONNX Runtime is compiled for x86-64-v3, and linked in, its static
# initializers ran before `main` and killed the process on a processor
# without AVX2 or BMI2. `runtime::init` asks the processor first and
# loads the library `scripts/ort-dylib.sh` makes from pyke's archive;
# none of `ort`'s defaults are wanted with that (no download, no
# copied libraries, no ndarray).
ort = { version = "=2.0.0-rc.13", default-features = false, features = [
    "std",
    "tracing",
    "api-27",
    "half",
    "load-dynamic",
] }
half.workspace = true
memmap2.workspace = true
ureq.workspace = true
sha2.workspace = true
# Microsoft's CPU-only ONNX Runtime, fetched where the processor cannot
# run greycard's own, comes as a tgz on Linux and a zip on Windows; the
# zip is read by hand (`unpack`) with flate2's deflate. Both already in
# the tree.
flate2.workspace = true
tar.workspace = true
thiserror.workspace = true
dirs.workspace = true
serde.workspace = true
serde_json.workspace = true
# Only to read `AdapterInfo` off a short-lived instance of our own for
# the provider-outcome record; never used to render anything. Same
# version `greycard-ui` gets through Slint.
wgpu = { workspace = true, optional = true }
pollster = { workspace = true, optional = true }

# The free memory of a Vulkan adapter, asked through wgpu's own
# instance (`VK_EXT_memory_budget`); the same ash wgpu builds its
# Vulkan backend on, everywhere but a Mac.
[target.'cfg(any(windows, target_os = "linux", target_os = "android"))'.dependencies]
ash = { version = "0.38", default-features = false, features = ["std"], optional = true }

# `runtime::leave`'s `_exit`, `ram`'s `sysconf`, and `runtime::trim_heap`'s
# `malloc_trim`. Already in the tree.
[target.'cfg(unix)'.dependencies]
libc.workspace = true

# `ram`'s `GlobalMemoryStatusEx`. Already in the tree.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_SystemInformation"] }

[dev-dependencies]
# The scratch folder's removal the tests share.
greycard-core = { path = "../greycard-core", features = ["testing"] }
image.workspace = true

# These compare or time a model on WebGPU, which a build without the
# feature does not have.
[[example]]
name = "probe"
required-features = ["webgpu"]

[[example]]
name = "subject_bench"
required-features = ["webgpu"]

[[example]]
name = "sam3_bench"
required-features = ["webgpu"]

[[example]]
name = "fill_bench"
required-features = ["webgpu"]

[[example]]
name = "remove_bench"
required-features = ["webgpu"]

[[example]]
name = "denoise_tiles"
required-features = ["webgpu"]

[[example]]
name = "mask_peak"
required-features = ["webgpu"]
